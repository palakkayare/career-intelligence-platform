name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs. Pushing three times in a minute should not burn
# three full test runs on commits nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lint tools
        run: pip install black==24.4.2 isort==5.13.2 flake8==7.0.0

      - name: Formatting
        run: black --check --diff .

      - name: Import order
        run: isort --check-only --diff .

      - name: Lint
        run: flake8 .

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The official image runs POSTGRES_USER as a superuser, which is what
        # lets Django create and drop the test_ database.
        image: postgres:16
        env:
          POSTGRES_USER: career_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: career_intel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Without this the cache never invalidates when a dependency
          # changes, and CI quietly tests against the wrong versions.
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install pytest pytest-django pytest-cov

      - name: Write .env
        # settings/base.py calls environ.Env.read_env(BASE_DIR / '.env'), so
        # the file has to exist. These are throwaway CI values: the test
        # settings never reach Redis, S3 or Razorpay.
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-secret-key-not-used-in-production
          DJANGO_DEBUG=False
          JWT_SIGNING_KEY=ci-jwt-signing-key-not-used-in-production
          DATABASE_URL=postgres://career_user:ci_password@localhost:5432/career_intel_db
          SALARY_IP_PEPPER=ci-pepper-not-used-in-production
          FIELD_ENCRYPTION_KEY=ZEsyHM-1v2lwzgabZn9ohbKG2CMmKVivHQUQMuMQLgQ=
          EOF

      - name: Check for missing migrations
        # Catches a model change committed without its migration, which would
        # otherwise only surface on deploy.
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run tests
        # --create-db because the runner is fresh every time; --reuse-db from
        # pytest.ini would look for a database that does not exist yet.
        #
        # The coverage floor is set just under where the suite sits today, so
        # it catches a real drop without failing on normal movement.
        run: |
          pytest --create-db \
            --cov=apps --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

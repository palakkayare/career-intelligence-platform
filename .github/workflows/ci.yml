name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The official image runs POSTGRES_USER as a superuser, which is what
        # lets Django create and drop the test_ database.
        image: postgres:16
        env:
          POSTGRES_USER: career_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: career_intel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # test.txt pulls in base.txt, so this covers both the app and its
        # test tooling. development.txt is deliberately not used: ipython and
        # the debug toolbar have no place on a CI runner.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Write .env
        # settings/base.py calls environ.Env.read_env(BASE_DIR / '.env'), so
        # the file has to exist. These are throwaway CI values: the test
        # settings never reach Redis, S3 or Razorpay.
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-secret-key-not-used-in-production
          DJANGO_DEBUG=False
          JWT_SIGNING_KEY=ci-jwt-signing-key-not-used-in-production
          DATABASE_URL=postgres://career_user:ci_password@localhost:5432/career_intel_db
          EOF

      - name: Check for missing migrations
        # Catches a model change committed without its migration, which would
        # otherwise only surface on deploy.
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run tests
        # --create-db because the runner is fresh every time; --reuse-db from
        # pytest.ini would look for a database that does not exist yet.
        run: pytest --create-db --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

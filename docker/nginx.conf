upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Resumes are the largest thing anyone uploads; the app caps them at 5 MB,
    # so anything bigger is rejected here rather than travelling to Gunicorn.
    client_max_body_size 6M;

    # Nginx serves files far more cheaply than Gunicorn, and every static
    # request it handles is a worker left free for actual requests.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit middleware reads the left-most entry of this header, so
        # the chain has to be preserved rather than overwritten.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Resume parsing and match scoring can be slow; a 60s Gunicorn timeout
        # is pointless if Nginx gives up at 30.
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

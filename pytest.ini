[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test

# Only collect from the apps package. Without this, standalone scripts whose
# names happen to end in _test.py (e.g. scripts/seed_phase3_test.py) get
# imported as test modules and their top-level code runs during collection.
testpaths = apps

# Django convention puts tests in tests.py, which pytest does not collect by
# default. Listing it here keeps the existing per-app tests.py files working.
python_files = tests.py test_*.py *_test.py

addopts =
    --reuse-db
    --strict-markers
    -ra

markers =
    regression: locks in a fix for a specific bug so it cannot come back

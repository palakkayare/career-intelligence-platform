<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      color: #111827;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
    }
    .callout {
      background: #eff6ff;
      padding: 15px;
      border-left: 4px solid #2563eb;
      margin: 20px 0;
    }
    .callout-danger {
      background: #fef2f2;
      border-left-color: #dc2626;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #666666;
      border-top: 1px solid #eeeeee;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}

  <div class="footer">
    <p>You are receiving this email because you have an account with Career Intelligence.</p>
    {% if unsubscribe_url %}
      <p><a href="{{ unsubscribe_url }}">Unsubscribe from these emails</a></p>
    {% endif %}
    <p>Need help? Contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
  </div>
</body>
</html>

{% extends "emails/base.html" %}
{% block content %}
  <h2>Job Posting Needs Revision</h2>
  <p>Hi {{ user_name }},</p>
  <p>Your posting <strong>{{ job_title }}</strong> was not approved.</p>

  <div class="callout callout-danger">
    <p style="margin: 0;"><strong>Reason: {{ rejection_reason }}</strong></p>
  </div>

  <p style="margin-top: 30px;">
    <a href="{{ link }}" class="btn">Edit Posting</a>
  </p>
{% endblock %}

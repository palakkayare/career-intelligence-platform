<!DOCTYPE html>
<html>
<head>
    <title>Google OAuth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 600px; margin: auto; }
        pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow: auto; }
        button { padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Career Intel — Google OAuth Test</h1>
    <p>Click the button below to sign in with Google:</p>

    <!-- Google's official Sign In button -->
    <div id="g_id_onload"
         data-client_id="329971117023-7026oco5m0i649ttt3d254u630lehiob.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <h2>Backend Response:</h2>
    <pre id="result">Sign in to see response...</pre>

    <script>
        async function handleCredentialResponse(response) {
            const idToken = response.credential;
            document.getElementById('result').textContent = 'Sending ID token to backend...';

            try {
                const res = await fetch('http://localhost:8000/api/v1/auth/google/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_token: idToken,
                        role: 'seeker',
                    }),
                });

                const data = await res.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);

                if (data.access) {
                    console.log('Access token:', data.access);
                    console.log('Use this for authenticated API calls!');
                }
            } catch (err) {
                document.getElementById('result').textContent = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
